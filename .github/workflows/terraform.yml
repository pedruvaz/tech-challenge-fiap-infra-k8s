# CI/CD das stacks de infraestrutura do Kubernetes.
#
# Fluxo:
#   pull request -> fmt, validate e `plan` das duas stacks (não altera nada)
#   push em main -> `apply` das duas stacks, em ordem
#
# Por que não há um ambiente de homologação aqui: homolog e produção se
# separam na camada da aplicação, por namespace do Kubernetes (ver
# `app-oficina`), e não duplicando a infraestrutura. Um segundo workspace do
# Terraform nesta conta criaria um segundo cluster EKS e um segundo RDS — os
# nomes colidiriam (role, ECR e cluster têm nome fixo derivado de
# `project_name`) e o custo dobraria sem ganho de avaliação. O cluster é
# compartilhado; o isolamento entre ambientes é feito por namespace.
#
# A ordem base -> cluster é obrigatória: o cluster lê os outputs da base via
# `terraform_remote_state`. Por isso os dois applies ficam no mesmo job, em
# sequência, em vez de uma matriz paralela.
#
# Pré-requisitos (uma vez — ver README):
#   Secret  AWS_TERRAFORM_ROLE_ARN   output `github_terraform_role_arn` da base
#   Var     AWS_REGION               ex.: us-east-1
#   Bucket de state criado à mão (etapa T0 do README)
name: Terraform

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Nunca dois applies simultâneos: o lock do S3 faria o segundo falhar, e
  # falha de lock é ruído que esconde erro de verdade.
  group: terraform-infra-k8s
  cancel-in-progress: false

permissions:
  id-token: write # OIDC assume a role da AWS
  contents: read
  pull-requests: write # comentário com o resultado do plan

env:
  TF_VERSION: '1.13.3'
  TF_IN_AUTOMATION: 'true'

jobs:
  # Roda sem credencial da AWS: pega erro de sintaxe e formatação antes de
  # gastar um job que precisa de permissão na conta.
  validate:
    name: Validate (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [base, cluster]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false: valida sem bucket de state nem credencial
      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  plan:
    name: Plan (${{ matrix.stack }})
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [base, cluster]
    defaults:
      run:
        working-directory: terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -input=false

      # continue-on-error: enquanto a `base` nunca tiver sido aplicada, o plan
      # do `cluster` falha por não achar o state dela. É esperado no primeiro
      # PR e não deve reprovar a revisão — o apply na main roda em ordem.
      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: terraform plan -no-color -input=false -lock-timeout=5m

      - name: Comenta o plan no PR
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const body = [
              '### Terraform plan — `' + process.env.STACK + '`',
              '',
              'Resultado: **' + process.env.OUTCOME + '**',
              '',
              'Log completo na aba Actions desta execução.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  apply:
    name: Apply
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Permite exigir aprovação manual antes do apply, configurável em
    # Settings > Environments sem mexer no workflow.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Apply base
        working-directory: terraform/base
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -lock-timeout=5m

      - name: Apply cluster
        working-directory: terraform/cluster
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -lock-timeout=5m

      # O `infra-db` precisa destes valores para o próximo apply da cadeia.
      - name: Outputs para as outras stacks
        working-directory: terraform/cluster
        run: |
          {
            echo "### Outputs do cluster"
            echo '```'
            terraform output -no-color 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
